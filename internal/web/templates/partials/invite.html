{{/* accept-invite is the Accept button for a pending invitation (an
     acceptForm): it accepts on the platform, then refreshes the program. */}}
{{define "accept-invite"}}<form class="accept-form" method="post" action="/invites/{{.Platform}}/{{.Handle}}/accept" data-confirm="Accept the invitation to {{.Name}} on {{platformLabel .Platform}}? HuntDeck accepts it there, then refreshes the program's scope and stats."><input type="hidden" name="back" value="{{.Back}}"><button type="submit" class="small accept-btn" title="Accept the invitation on {{platformLabel .Platform}}, then refresh the program" aria-label="Accept the invitation to {{.Name}}"><svg class="i"><use href="#i-check"/></svg><span class="acc-label">Accept</span></button></form>{{end}}
